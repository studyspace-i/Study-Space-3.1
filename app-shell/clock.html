<body>
<div class="tabs" id="tabs"></div>
<div id="v" style="padding-top:2px"></div>
<script src="/child.js"></script><script src="/shiftcard.js"></script>
<script>
(function () {
  var Core = parent.AppCore, AL = parent.AppAlarms, FO = parent.AppFocus, Shell = parent.AppShell, LS = Core.LS, N = parent.Native;
  var $ = function (s, r) { return (r || document).querySelector(s); }, esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function toast(t) { var e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2300); }
  function z2(n) { return ("0" + n).slice(-2); }
  function J(k, d) { try { var v = JSON.parse(LS.get(k, "null")); return v == null ? d : v; } catch (e) { return d; } }
  function W(k, v) { LS.set(k, JSON.stringify(v)); }

  /* ---------- clock settings ---------- */
  var CS_DEF = { h24: false, pick: "dial", tpick: "keypad", anim: true, hap: true, sound: "chime", snz: 5, maxSnz: 0, rise: 0, vib: true, del: false, task: "none", tsound: "bell", tvib: true, trise: 0, swKeep: true, cmp: "prev" };
  function CS() { var o = {}, s = J("ss_clock_set", {}); for (var k in CS_DEF) o[k] = s[k] === undefined ? CS_DEF[k] : s[k]; return o; }
  function setCS(k, v) { var c = J("ss_clock_set", {}); c[k] = v; W("ss_clock_set", c); applyCS(); }
  function applyCS() { document.documentElement.classList.toggle("noanim", CS().anim === false); }
  applyCS();
  function haptic() { try { if (CS().hap) navigator.vibrate && navigator.vibrate(8); } catch (e) {} }
  function fmtT(h, m) { var S = CS(); if (S.h24) return { t: z2(h) + ":" + z2(m), p: "" }; return { t: ((h % 12) || 12) + ":" + z2(m), p: h >= 12 ? "PM" : "AM" }; }
  function fmt12(h, m) { return fmtT(h, m); }

  var IC = {
    plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    dial: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    kb: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>',
    spin: '<svg viewBox="0 0 24 24"><path d="M7 4h10M7 20h10"/><rect x="5" y="9" width="14" height="6" rx="2"/><path d="M12 6v.01M12 18v.01"/></svg>',
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
    stop: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
  };

  /* ---------- sheets ---------- */
  function sheet(html, tall) {
    var m = document.createElement("div"); m.className = "mask";
    m.innerHTML = '<div class="pnl' + (tall ? " tall" : "") + '">' + html + '</div>'; document.body.appendChild(m);
    m.close = function () { try { AL.stop(); } catch (e) {} m.remove(); };
    m.addEventListener("click", function (e) { if (e.target === m) m.close(); });
    return m;
  }
  function confirmBox(title, text, yes, cb) {
    var m = sheet('<h3>' + esc(title) + '</h3><div style="font-size:14px;color:var(--ss-mut);margin:6px 0 4px;line-height:1.5">' + esc(text) + '</div><div class="foot"><button id="cn">Cancel</button><button class="pri" id="ok" style="background:#ef4444">' + esc(yes) + '</button></div>');
    $("#cn", m).onclick = m.close; $("#ok", m).onclick = function () { m.close(); cb(); };
  }
  function pickList(title, opts, cur, cb) {
    var m = sheet('<h3>' + esc(title) + '</h3><div style="margin-top:6px">' + opts.map(function (o) { return '<div class="field" data-v="' + esc(o[0]) + '"><div><b>' + esc(o[1]) + '</b>' + (o[2] ? '<i>' + esc(o[2]) + '</i>' : "") + '</div><span class="tg ' + (String(o[0]) === String(cur) ? "on" : "") + '"></span></div>'; }).join("") + '</div>');
    m.addEventListener("click", function (e) { var f = e.target.closest("[data-v]"); if (!f) return; haptic(); var v = f.dataset.v; m.close(); cb(v); });
  }
  function soundName(s) { if (AL.SOUNDS[s]) return AL.SOUNDS[s].name; var f = J("ss_sound_files", []).filter(function (x) { return "file:" + x.id === s; })[0]; return f ? f.name : "Chime"; }
  async function pickSound(cur, done) {
    var files = J("ss_sound_files", []), val = cur;
    var m = sheet('<h3>Sound</h3><div id="sl"></div><button class="chip" id="addf" style="width:100%;margin-top:10px;height:44px;justify-content:center">🎵 Choose from my files…</button><input type="file" id="fi" accept="audio/*" hidden/><div class="foot"><button id="cn">Cancel</button><button class="pri" id="ok">Done</button></div>', true);
    function paint() { $("#sl", m).innerHTML = Object.keys(AL.SOUNDS).map(function (k) { return '<div class="row" data-k="' + k + '"><span class="tg ' + (val === k ? "on" : "") + '"></span><b style="flex:1">' + AL.SOUNDS[k].name + '</b><button class="chip" data-p="' + k + '">▶ Play</button></div>'; }).join("") + files.map(function (f) { return '<div class="row" data-k="file:' + f.id + '"><span class="tg ' + (val === "file:" + f.id ? "on" : "") + '"></span><b style="flex:1">' + esc(f.name) + '</b><button class="chip" data-p="file:' + f.id + '">▶ Play</button></div>'; }).join(""); }
    paint();
    m.addEventListener("click", function (e) { var p = e.target.closest("[data-p]"); if (p) return AL.play(p.dataset.p, false); var r = e.target.closest(".row[data-k]"); if (r) { val = r.dataset.k; paint(); } });
    $("#addf", m).onclick = function () { $("#fi", m).click(); };
    $("#fi", m).onchange = async function (e) { var f = e.target.files[0]; if (!f) return; if (f.size > 6 * 1024 * 1024) return toast("Please choose a file under 6 MB"); var id = "f" + Date.now(); await AL.putFile("file:" + id, f); AL.nativeSound(id, f); files.push({ id: id, name: f.name.replace(/\.[^.]+$/, "") }); W("ss_sound_files", files); val = "file:" + id; paint(); };
    $("#cn", m).onclick = m.close;
    $("#ok", m).onclick = function () { AL.stop(); m.remove(); done(val); };
  }

  /* ---------- wheel (used by the "spinner" picker style) ---------- */
  function wheel(el, items, idx, cb) {
    el.innerHTML = '<div class="pad"></div>' + items.map(function (i) { return '<div class="it">' + i + '</div>'; }).join("") + '<div class="pad"></div>';
    var t, nodes = el.querySelectorAll(".it");
    function mark(i) { nodes.forEach(function (n, k) { n.classList.toggle("sel", k === i); }); }
    el.scrollTop = idx * 40; mark(idx);
    el.addEventListener("scroll", function () { clearTimeout(t); t = setTimeout(function () { var i = Math.max(0, Math.min(items.length - 1, Math.round(el.scrollTop / 40))); mark(i); haptic(); if (cb) cb(i); }, 70); }, { passive: true });
    return { get: function () { return Math.max(0, Math.min(items.length - 1, Math.round(el.scrollTop / 40))); }, set: function (i) { el.scrollTop = i * 40; mark(i); } };
  }

  /* ---------- Samsung-style number pad ---------- */
  function padHtml(extra) { return '<div class="kp">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button data-k="' + n + '">' + n + '</button>'; }).join("") + (extra || '<button class="fn" data-k="00">00</button>') + '<button data-k="0">0</button><button class="fn" data-k="bs" aria-label="Delete">⌫</button></div>'; }

  /* a plain number question with the on-screen pad: askNum("Title", 25, "minutes", cb) */
  function askNum(title, def, unit, ok, max) {
    var buf = String(def || ""), fresh = true;
    var m = sheet('<h3>' + esc(title) + '</h3><div style="text-align:center;margin:10px 0 2px"><span id="nv" style="font-size:60px;font-weight:300;color:var(--a1);font-variant-numeric:tabular-nums"></span></div><div style="text-align:center;font-size:13px;color:var(--ss-mut);margin-bottom:14px">' + esc(unit) + '</div>' + padHtml() + '<div class="foot2"><span class="sp"></span><button class="tb" id="cn">Cancel</button><button class="tb pri" id="ok">OK</button></div>');
    function show() { $("#nv", m).textContent = buf === "" ? "0" : buf; }
    show();
    m.addEventListener("click", function (e) { var b = e.target.closest("[data-k]"); if (!b) return; haptic(); var k = b.dataset.k; if (k === "bs") { buf = buf.slice(0, -1); fresh = false; } else { if (fresh) { buf = ""; fresh = false; } if (buf.length < 4) buf += k; } buf = buf.replace(/^0+(?=\d)/, ""); if (max && +buf > max) buf = String(max); show(); });
    $("#cn", m).onclick = m.close; $("#ok", m).onclick = function () { var v = parseInt(buf, 10); if (v > 0) { m.remove(); ok(v); } else toast("Enter a number"); };
  }

  /* ---------- time picker: dial · keyboard · spinner ---------- */
  function pickTime(H, M, title, cb) {
    var S = CS(), mode = S.pick, sel = "h", h24 = S.h24, hb = "", mb = "", m;
    function hv() { return h24 ? H : (H % 12 || 12); }
    function setHv(v) { H = h24 ? v : (v % 12) + (H >= 12 ? 12 : 0); }
    m = sheet('<h3>' + esc(title || "Set time") + '</h3><div class="bigt"><button class="f on" id="fh"></button><span class="co">:</span><button class="f" id="fm"></button><div class="apm" id="apm"></div></div><div id="pb" style="min-height:300px"></div><div class="foot2"><div class="modes" id="md"></div><span class="sp"></span><button class="tb" id="cn">Cancel</button><button class="tb pri" id="ok">OK</button></div>', true);
    function head() {
      var fh = $("#fh", m), fm = $("#fm", m);
      fh.textContent = hb.length === 1 ? "0" + hb : z2(hv()); fm.textContent = mb.length === 1 ? "0" + mb : z2(M);
      fh.className = "f" + (sel === "h" ? " on" : "") + (hb ? " pend" : ""); fm.className = "f" + (sel === "m" ? " on" : "") + (mb ? " pend" : "");
      $("#apm", m).innerHTML = h24 ? "" : '<button data-ap="0" class="' + (H < 12 ? "on" : "") + '">AM</button><button data-ap="1" class="' + (H >= 12 ? "on" : "") + '">PM</button>';
      $("#md", m).innerHTML = [["dial", IC.dial], ["kb", IC.kb], ["spin", IC.spin]].map(function (x) { return '<button data-md="' + x[0] + '" class="' + (mode === x[0] ? "on" : "") + '" aria-label="' + x[0] + '">' + x[1] + '</button>'; }).join("");
    }
    function body() {
      var pb = $("#pb", m); head();
      if (mode === "dial") dialBody(pb); else if (mode === "kb") kbBody(pb); else spinBody(pb);
    }
    /* dial */
    function dialBody(pb) {
      var svgNS = "", html = '<div class="dial" id="dl"><svg viewBox="0 0 260 260"><circle class="face" cx="130" cy="130" r="126"/><line class="hand" id="hd" x1="130" y1="130" x2="130" y2="130"/><circle class="knob" id="kn" r="22" cx="130" cy="30"/><circle class="dot" cx="130" cy="130" r="4"/><g id="nums"></g></svg></div>';
      pb.innerHTML = html + '<div style="text-align:center;font-size:12.5px;color:var(--ss-mut);margin-top:12px">' + (sel === "h" ? "Choose the hour — or tap the keyboard icon to type" : "Choose the minutes") + '</div>';
      var g = $("#nums", pb), items = "";
      function pos(i, r) { var a = (i * 30 - 90) * Math.PI / 180; return [130 + r * Math.cos(a), 130 + r * Math.sin(a)]; }
      var cur = sel === "h" ? hv() : M;
      for (var i = 1; i <= 12; i++) {
        var p = pos(i, 100), val = sel === "h" ? i : (i % 12) * 5, on = false;
        items += '<text x="' + p[0] + '" y="' + p[1] + '" class="' + (on ? "sel" : "") + '">' + (sel === "h" ? i : z2(val)) + '</text>';
      }
      if (sel === "h" && h24) for (var j = 1; j <= 12; j++) { var q = pos(j, 66), v2 = j === 12 ? 0 : j + 12; items += '<text class="in ' + (H === v2 ? "sel" : "") + '" x="' + q[0] + '" y="' + q[1] + '">' + z2(v2) + '</text>'; }
      g.innerHTML = items;
      function hand() {
        var ang, r = 100;
        if (sel === "h") { var v = H; if (h24) { if (v === 0 || v > 12) { r = 66; } ang = ((v % 12) * 30 - 90); } else ang = ((hv() % 12) * 30 - 90); }
        else ang = (M * 6 - 90);
        var a = ang * Math.PI / 180, x = 130 + r * Math.cos(a), y = 130 + r * Math.sin(a);
        $("#hd", pb).setAttribute("x2", x); $("#hd", pb).setAttribute("y2", y); $("#kn", pb).setAttribute("cx", x); $("#kn", pb).setAttribute("cy", y);
        $("#hd", pb).setAttribute("x1", 130);
        $("#nums", pb).querySelectorAll("text").forEach(function (t) { t.classList.remove("sel"); });
        var nodes = $("#nums", pb).querySelectorAll("text"), best = null, bd = 99999;
        nodes.forEach(function (t) { var dx = +t.getAttribute("x") - x, dy = +t.getAttribute("y") - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = t; } });
        if (best && bd < 120) best.classList.add("sel");
      }
      hand();
      var dl = $("#dl", pb), dragging = false;
      function at(e) {
        var r = dl.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 260 - 130, y = (e.clientY - r.top) / r.height * 260 - 130;
        var ang = Math.atan2(y, x) * 180 / Math.PI + 90; if (ang < 0) ang += 360; var dist = Math.sqrt(x * x + y * y);
        if (sel === "h") { var n = Math.round(ang / 30) % 12; if (h24) { if (dist < 83) setHv(n === 0 ? 0 : n + 12); else setHv(n === 0 ? 12 : n); } else { setHv(n === 0 ? 12 : n); } hb = ""; }
        else { M = Math.round(ang / 6) % 60; mb = ""; }
        head(); hand(); haptic();
      }
      dl.addEventListener("pointerdown", function (e) { dragging = true; try { dl.setPointerCapture(e.pointerId); } catch (x) {} at(e); });
      dl.addEventListener("pointermove", function (e) { if (dragging) at(e); });
      dl.addEventListener("pointerup", function () { if (!dragging) return; dragging = false; if (sel === "h") { sel = "m"; setTimeout(body, 160); } });
    }
    /* keyboard */
    function kbBody(pb) {
      pb.innerHTML = '<div style="text-align:center;font-size:13px;color:var(--ss-mut);margin:0 0 14px">Type the digits — for example <b>7</b> <b>3</b> <b>0</b> for 7:30</div>' + padHtml('<button class="fn" data-k="nx">' + (sel === "h" ? "Min ›" : "‹ Hour") + '</button>');
    }
    function typeDigit(d) {
      if (sel === "h") {
        if (hb === "") {
          if ((!h24 && d >= 2) || (h24 && d >= 3)) { setHv(d === 0 && !h24 ? 12 : d); sel = "m"; }
          else hb = String(d);
        } else {
          var v = +(hb + d); hb = "";
          if (h24) v = Math.min(23, v); else { if (v === 0) v = 12; v = Math.min(12, v); }
          setHv(v); sel = "m";
        }
      } else {
        if (mb === "") { if (d >= 6) { M = d; } else mb = String(d); }
        else { M = Math.min(59, +(mb + d)); mb = ""; }
      }
    }
    function back() { if (hb) hb = ""; else if (mb) mb = ""; else if (sel === "m") sel = "h"; }
    /* spinner */
    function spinBody(pb) {
      var hrs = [], i; if (h24) for (i = 0; i < 24; i++) hrs.push(z2(i)); else for (i = 1; i <= 12; i++) hrs.push(String(i));
      var mins = []; for (i = 0; i < 60; i++) mins.push(z2(i));
      pb.innerHTML = '<div class="wheels"><div class="band"></div><div class="wheel" id="wh"></div><div class="sep">:</div><div class="wheel" id="wm"></div></div>';
      var wh = wheel($("#wh", pb), hrs, h24 ? H : (hv() - 1), function (k) { setHv(h24 ? k : k + 1); hb = ""; head(); });
      wheel($("#wm", pb), mins, M, function (k) { M = k; mb = ""; head(); });
    }
    m.addEventListener("click", function (e) {
      var ap = e.target.closest("[data-ap]"); if (ap) { haptic(); H = (H % 12) + (ap.dataset.ap === "1" ? 12 : 0); body(); return; }
      var md = e.target.closest("[data-md]"); if (md) { haptic(); mode = md.dataset.md; setCS("pick", mode); hb = mb = ""; body(); return; }
      if (e.target.closest("#fh")) { sel = "h"; hb = mb = ""; body(); return; }
      if (e.target.closest("#fm")) { sel = "m"; hb = mb = ""; body(); return; }
      var k = e.target.closest("[data-k]"); if (!k || mode !== "kb") return; haptic();
      var v = k.dataset.k;
      if (v === "bs") back(); else if (v === "nx") { sel = sel === "h" ? "m" : "h"; hb = mb = ""; } else if (v === "00") { typeDigit(0); typeDigit(0); } else typeDigit(+v);
      body();
    });
    $("#cn", m).onclick = m.close;
    $("#ok", m).onclick = function () { m.remove(); cb(H, M); };
    body();
  }

  /* ---------- duration picker for timers: keypad fills from the right, like the phone's own clock ---------- */
  function pickDur(ms, title, o, cb) {
    o = o || {};
    var S = CS(), mode = S.tpick === "spinner" ? "spin" : "pad", digits = "", extra = 0, m;
    var tot = Math.round((ms || 0) / 1000); if (tot > 0) { var hh = Math.floor(tot / 3600), mm = Math.floor(tot % 3600 / 60), ss = tot % 60; digits = String(hh * 10000 + mm * 100 + ss); }
    var H0 = Math.floor(tot / 3600), M0 = Math.floor(tot % 3600 / 60), S0 = tot % 60;
    m = sheet('<h3>' + esc(title || "Timer") + '</h3>' + (o.label !== undefined ? '<div class="field" style="margin-top:6px"><div><i>Label</i><input type="text" id="lb" maxlength="30" placeholder="Name (optional)" value="' + esc(o.label) + '"/></div></div>' : "") +
      '<div id="dd"></div><div id="pb"></div><div class="foot2"><div class="modes" id="md"></div><span class="sp"></span><button class="tb" id="cn">Cancel</button>' + (o.add ? '<button class="tb" id="ad">Add</button>' : "") + '<button class="tb pri" id="ok">' + esc(o.ok || "OK") + '</button></div>', true);
    function val() {
      if (mode === "spin") return (H0 * 3600 + M0 * 60 + S0) * 1000;
      var d = ("000000" + digits).slice(-6); return ((+d.slice(0, 2)) * 3600 + (+d.slice(2, 4)) * 60 + (+d.slice(4, 6))) * 1000;
    }
    function draw() {
      var d = ("000000" + digits).slice(-6), parts = mode === "spin" ? [z2(H0), z2(M0), z2(S0)] : [d.slice(0, 2), d.slice(2, 4), d.slice(4, 6)], started = false;
      $("#dd", m).innerHTML = '<div style="display:flex;justify-content:center;align-items:baseline;gap:6px;margin:14px 0 14px;font-variant-numeric:tabular-nums">' + parts.map(function (p, i) { var live = mode === "spin" || digits.length > [4, 2, 0][i]; return '<span style="font-size:58px;font-weight:300;line-height:1;color:' + (live ? "var(--a1)" : "var(--ss-faint)") + '">' + p + '</span><span style="font-size:15px;font-weight:800;color:var(--ss-mut);margin-right:8px">' + "hms"[i] + '</span>'; }).join("") + '</div>';
      $("#md", m).innerHTML = [["pad", IC.kb], ["spin", IC.spin]].map(function (x) { return '<button data-md="' + x[0] + '" class="' + (mode === x[0] ? "on" : "") + '">' + x[1] + '</button>'; }).join("");
      var pb = $("#pb", m);
      if (mode === "pad") {
        pb.innerHTML = '<div class="scroll" style="justify-content:center;margin-bottom:12px">' + [["+1 min", 60], ["+5 min", 300], ["+10 min", 600], ["+30 min", 1800], ["+1 hr", 3600]].map(function (q) { return '<button class="chip" data-q="' + q[1] + '">' + q[0] + '</button>'; }).join("") + '</div>' + padHtml();
      } else {
        var a = [], b = [], i; for (i = 0; i < 100; i++) a.push(z2(i)); for (i = 0; i < 60; i++) b.push(z2(i));
        pb.innerHTML = '<div class="wheels"><div class="band"></div><div class="wheel" id="w1"></div><div class="sep">:</div><div class="wheel" id="w2"></div><div class="sep">:</div><div class="wheel" id="w3"></div></div><div class="wlab"><span>hours</span><span style="width:12px"></span><span>min</span><span style="width:12px"></span><span>sec</span></div>';
        wheel($("#w1", pb), a, H0, function (k) { H0 = k; draw1(); }); wheel($("#w2", pb), b, M0, function (k) { M0 = k; draw1(); }); wheel($("#w3", pb), b, S0, function (k) { S0 = k; draw1(); });
      }
    }
    function draw1() { var d = $("#dd", m); if (!d) return; var sp = d.querySelectorAll("span"); sp[0].textContent = z2(H0); sp[2].textContent = z2(M0); sp[4].textContent = z2(S0); }
    m.addEventListener("click", function (e) {
      var md = e.target.closest("[data-md]"); if (md) { haptic(); if (md.dataset.md === "spin" && mode === "pad") { var t = val() / 1000; H0 = Math.min(99, Math.floor(t / 3600)); M0 = Math.floor(t % 3600 / 60); S0 = t % 60; } else if (md.dataset.md === "pad" && mode === "spin") { digits = String(H0 * 10000 + M0 * 100 + S0); if (digits === "0") digits = ""; } mode = md.dataset.md; setCS("tpick", mode === "spin" ? "spinner" : "keypad"); draw(); return; }
      var q = e.target.closest("[data-q]"); if (q) { haptic(); var t2 = Math.min(359999, val() / 1000 + (+q.dataset.q)), hh2 = Math.floor(t2 / 3600), mm2 = Math.floor(t2 % 3600 / 60), ss2 = t2 % 60; digits = String(hh2 * 10000 + mm2 * 100 + ss2); draw(); return; }
      var k = e.target.closest("[data-k]"); if (!k) return; haptic(); var v = k.dataset.k;
      if (v === "bs") digits = digits.slice(0, -1); else if (digits.length + v.length <= 6) digits = (digits + v).replace(/^0+/, "");
      draw();
    });
    $("#cn", m).onclick = m.close;
    function fin(start) { var v = val(); if (v < 1000) return toast("Set a time first"); var lb = $("#lb", m); m.remove(); cb(v, lb ? lb.value.trim() : undefined, start); }
    $("#ok", m).onclick = function () { fin(true); };
    if ($("#ad", m)) $("#ad", m).onclick = function () { fin(false); };
    draw();
  }

  /* ---------- tabs ---------- */

      { g: "Alerts and reliability", ic: "🔋", t: "Battery", d: RACC.batteryUnrestricted ? "Unrestricted — alarms are never delayed" : "Set to “Unrestricted” so alarms are never delayed", kw: "battery optimization unrestricted doze", v: RACC.batteryUnrestricted ? "OK" : "Allow", run: function () { if (RACC.native) AL.openBattery(); else { try { N.Settings.open({ optionAndroid: N.AndroidSettings.BatteryOptimization, optionIOS: N.IOSSettings.App }); } catch (e) {} } } },
      { g: "Alerts and reliability", ic: "🧪", t: "Test alarm in 10 seconds", d: "Close the app after tapping to check it rings", kw: "test alarm check ring", v: "Test", run: async function () { if (!(await Core.perm.need("notifications"))) return; await AL.testIn(10); toast("Test alarm in 10 seconds"); } },

      { g: "More", ic: "↺", t: "Reset clock settings", d: "Puts every option on this screen back to normal", kw: "reset default restore", run: function () { confirmBox("Reset settings?", "Your alarms and timers stay as they are.", "Reset", function () { W("ss_clock_set", {}); applyCS(); toast("Settings reset"); draw(); }); } },
      { g: "More", ic: "📴", t: "Works offline", d: "The clock, alarms and timers never need internet", kw: "offline internet about info", v: "✓", run: function () { toast("Everything here runs on your phone"); } }
    ].filter(function (x) { return !x.hide; });
  }
  async function loadRel() { try { REL = await AL.health(); RACC = await AL.access(); } catch (e) {} draw(); }
  function managePresets() {
    var m = sheet('<h3>Quick timers</h3><div id="pl"></div><button class="chip" id="pa" style="width:100%;margin-top:10px;height:44px;justify-content:center">＋ Add quick timer</button><div class="foot2"><span class="sp"></span><button class="tb pri" id="ok">Done</button></div>', true);
    function paint() { var P = presets(); $("#pl", m).innerHTML = P.map(function (p, i) { return '<div class="field"><div><b>' + esc(p.n) + '</b><i>' + clk(p.ms) + '</i></div><button class="chip" data-r="' + i + '">Remove</button></div>'; }).join("") || '<div class="empty">No quick timers</div>'; }
    paint();
    m.addEventListener("click", function (e) { var r = e.target.closest("[data-r]"); if (r) { var P = presets(); P.splice(+r.dataset.r, 1); W("ss_tpresets", P); paint(); } });
    $("#pa", m).onclick = function () { pickDur(600000, "New quick timer", { label: "", ok: "Save" }, function (ms, label) { var P = presets(); P.push({ n: label || dtxt(ms), ms: ms }); W("ss_tpresets", P.slice(0, 12)); paint(); }); };
    $("#ok", m).onclick = function () { m.remove(); draw(); };
  }
  var sq = "";
  function draw() {
    if (cur !== "settings") return;
    var v = $("#v"), box = $("#sl2"), q = sq.trim().toLowerCase(), list = defs().filter(function (d) { return !q || (d.t + " " + d.d + " " + d.kw + " " + d.g).toLowerCase().indexOf(q) > -1; });
    if (!box) {
      v.innerHTML = '<div class="hd"><div><h2>Settings</h2><small>Alarm, timer, stopwatch and more</small></div></div><div class="srch">' + IC.search + '<input id="q" type="text" placeholder="Search settings" autocomplete="off" value="' + esc(sq) + '"/></div><div id="sl2"></div>';
      $("#q").oninput = function () { sq = this.value; draw(); };
      box = $("#sl2");
      box.onclick = function (e) { var r = e.target.closest("[data-i]"); if (!r) return; haptic(); var d = defs().filter(function (x) { return !q || (x.t + " " + x.d + " " + x.kw + " " + x.g).toLowerCase().indexOf((sq || "").trim().toLowerCase()) > -1; })[+r.dataset.i]; if (d) { var res = d.run(); if (d.tg !== undefined) setTimeout(draw, 0); } };
    }
    if (!list.length) { box.innerHTML = '<div class="empty"><div class="em">🔍</div>No settings match “' + esc(sq) + '”.</div>'; return; }
    var out = "", last = "";
    list.forEach(function (d, i) {
      if (d.g !== last) { if (last) out += "</div>"; out += '<div class="grp">' + esc(d.g) + '</div><div class="card" style="padding:0;overflow:hidden">'; last = d.g; }
      out += '<button class="srow" data-i="' + i + '"><span class="ic">' + d.ic + '</span><div><b>' + esc(d.t) + '</b><i>' + esc(d.d) + '</i></div>' + (d.tg !== undefined ? '<span class="tg ' + (d.tg ? "on" : "") + '"></span>' : (d.v ? '<span class="v">' + esc(d.v) + ' ›</span>' : "")) + '</button>';
    });
    box.innerHTML = out + "</div>";
  }
  VIEWS.settings = function vSettings() { sq = ""; var b0 = $("#sl2"); if (b0) b0.remove(); draw(); loadRel(); };

  var SUBJ = ["General", "Maths", "Physics", "Chemistry", "Biology", "English", "Reading"];
  function streak() { var log = J("ss_focus_log2", {}), n = 0; for (var i = 0; i < 365; i++) { var k = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10); if (log[k] && log[k].min > 0) n++; else if (i > 0) break; } return n; }
  function vFocus() {
    var v = $("#v"), C = FO.cfg(), ST = FO.state(), log = J("ss_focus_log2", {}), key = new Date().toISOString().slice(0, 10), td = log[key] || { min: 0, n: 0, subj: {} }, week = [];
    for (var i = 6; i >= 0; i--) { var d = new Date(Date.now() - i * 86400000); week.push({ l: d.toLocaleDateString([], { weekday: "narrow" }), m: (log[d.toISOString().slice(0, 10)] || {}).min || 0 }); }
    var mx = Math.max(30, Math.max.apply(null, week.map(function (w) { return w.m; })));
    var custom = SUBJ.indexOf(C.subject) === -1 ? [C.subject] : [], mins = C.focus;
    v.innerHTML = '<div class="hd"><div><h2>Focus</h2><small>Drag the dial to set your time</small></div></div>' +
      '<div class="scroll" id="sj">' + SUBJ.concat(custom).map(function (s) { return '<button class="chip ' + (C.subject === s ? "on" : "") + '" data-s="' + esc(s) + '">' + esc(s) + '</button>'; }).join("") + '<button class="chip" data-s="__new">＋ Other</button></div>' +
      '<div class="dwrap" id="dw">' + FO.dialSvg(mins, 120) + '<div class="dc"><b id="dm">' + mins + '</b><span>minutes</span></div></div>' +
      '<div class="nudge"><button data-n="-5">−5</button><button data-n="-1">−1</button><button data-n="1">+1</button><button data-n="5">+5</button></div>' +
      '<div class="scroll" id="fl">' + [15, 25, 45, 60, 90].map(function (m) { return '<button class="chip ' + (mins === m ? "on" : "") + '" data-m="' + m + '">' + m + ' min</button>'; }).join("") + '<button class="chip" data-m="c">Custom</button></div>' +
      '<div class="card" style="margin-top:14px;padding:4px 16px"><div class="row"><div style="flex:1"><b>Break</b></div><div class="scroll" id="fb">' + [5, 10, 15].map(function (m) { return '<button class="chip ' + (C.brk === m ? "on" : "") + '" data-b="' + m + '">' + m + ' min</button>'; }).join("") + '<button class="chip" data-b="c">Custom</button></div></div>' +
      '<div class="row" id="fa"><div style="flex:1"><b>Start breaks automatically</b></div><span class="tg ' + (C.auto ? "on" : "") + '"></span></div>' +
      '<div class="row"><div style="flex:1"><b>Background sound</b></div><button class="chip" id="amb">' + ({ off: "Off", rain: "Rain 🌧", brown: "Brown 🌊", white: "White 🌫" }[C.amb]) + '</button></div></div>' +
      '<button class="big" id="go" style="margin-top:14px">' + (ST.phase !== "idle" ? "Back to session" : "Start focus · " + mins + " min") + '</button>' +
      '<div class="sub">Today</div><div class="stat"><div><b>' + (td.min >= 60 ? Math.floor(td.min / 60) + "h " + td.min % 60 + "m" : td.min + "m") + '</b><span>Studied</span></div><div><b>' + td.n + '</b><span>Sessions</span></div><div><b>' + streak() + '🔥</b><span>Day streak</span></div></div>' +
      '<div class="card" style="margin-top:10px"><div style="display:flex;gap:8px;align-items:flex-end;height:78px">' + week.map(function (w) { return '<div style="flex:1;text-align:center"><div style="height:' + Math.max(4, w.m / mx * 58) + 'px;border-radius:7px;background:var(--a1);opacity:' + (w.m ? 1 : .22) + '"></div><div style="font-size:10px;color:var(--ss-faint);margin-top:4px;font-weight:700">' + w.l + '</div></div>'; }).join("") + '</div></div>' +
      '<div style="font-size:12px;color:var(--ss-mut);margin:12px 4px;line-height:1.5">Tip: switch on <b>Do Not Disturb</b> before you start. While focus is on, the whole app is locked to your timer.</div>';
    function setMin(m) { mins = Math.max(1, Math.min(240, m)); FO.setCfg({ focus: mins }); var dm = $("#dm"); if (dm) dm.textContent = mins; var go = $("#go"); if (go && ST.phase === "idle") go.textContent = "Start focus · " + mins + " min"; }
    var dial = FO.attachDial($("#dw"), 120, 1, function () { return Math.min(120, mins); }, function (m) { setMin(m); }, function () { vFocus(); });
    $("#sj").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; if (b.dataset.s === "__new") { var m2 = sheet('<div style="font-size:18px;font-weight:800;margin-bottom:4px">Subject name</div><input type="text" id="nm" maxlength="20" placeholder="e.g. Accountancy"/><div class="foot"><button id="cn">Cancel</button><button class="pri" id="ok">Save</button></div>'); setTimeout(function () { $("#nm", m2).focus(); }, 120); $("#cn", m2).onclick = function () { m2.remove(); }; $("#ok", m2).onclick = function () { var n = $("#nm", m2).value.trim(); if (n) { FO.setCfg({ subject: n.slice(0, 20) }); m2.remove(); vFocus(); } }; return; } FO.setCfg({ subject: b.dataset.s }); vFocus(); };
    v.querySelector(".nudge").onclick = function (e) { var b = e.target.closest("button"); if (b) { haptic(); setMin(mins + (+b.dataset.n)); vFocus(); } };
    $("#fl").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; if (b.dataset.m === "c") return askNum("Custom focus time", mins, "minutes (1 – 240)", function (m) { setMin(m); vFocus(); }); setMin(+b.dataset.m); vFocus(); };
    $("#fb").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; if (b.dataset.b === "c") return askNum("Custom break", C.brk, "minutes", function (m) { FO.setCfg({ brk: Math.min(60, m) }); vFocus(); }); FO.setCfg({ brk: +b.dataset.b }); vFocus(); };
    $("#fa").onclick = function () { FO.setCfg({ auto: !FO.cfg().auto }); vFocus(); };
    $("#amb").onclick = function () { var o = ["off", "rain", "brown", "white"]; FO.setCfg({ amb: o[(o.indexOf(FO.cfg().amb) + 1) % 4] }); vFocus(); };
    $("#go").onclick = function () { if (FO.state().phase !== "idle") return FO.open(); FO.start("focus"); };
  }
  window.parent.addEventListener("ss:focus", function () { if (cur === "focus" && !document.hidden) { try { vFocus(); } catch (e) {} } });


  /* ================= SHIFT ================= */
  var HEALTH = {};
  var ACC = { fullScreen: true, batteryUnrestricted: false, native: false };
  async function vShift() {
    var v = $("#v");
    v.innerHTML = '<div class="hd"><div><h2>Shift</h2><small>Your timeline, check-in and reminders</small></div></div><div id="sc"></div><div id="rm"></div>';
    window.SSShift.mount($("#sc"), { full: true });
    HEALTH = await AL.health(); ACC = await AL.access(); drawRem();
  }
  function drawRem() {
    var rem = LS.get("ss_shift_rem", "0") === "1", lead = +LS.get("ss_shift_lead", "10"), nud = AL.nudgesOn(), H = HEALTH, ok = H.notif === "granted";
    var st = window.SSShift.data(), el = $("#rm"); if (!el) return;
    el.innerHTML = '<div class="sub">Alerts &amp; reminders</div><div class="card" style="padding:2px 16px">' +
      '<div class="row" data-r="nudge"><div style="flex:1"><b>Cute study nudges 💌</b><i>Friendly messages before your shift and during the day</i></div><span class="tg ' + (nud ? "on" : "") + '"></span></div>' +
      '<div class="row" data-r="rem"><div style="flex:1"><b>Shift alarm</b><i>Rings when your shift is about to start</i></div><span class="tg ' + (rem ? "on" : "") + '"></span></div>' +
      (rem ? '<div class="scroll" style="padding:2px 0 12px" id="ld">' + [[0, "On time"], [10, "10 min before"], [30, "30 min before"], [60, "1 hour before"]].map(function (o) { return '<button class="chip ' + (lead === o[0] ? "on" : "") + '" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join("") + '<button class="chip" data-r="snd">🔔 ' + esc(soundName(LS.get("ss_shift_sound", "chime"))) + '</button></div>' : "") +
      '<div class="row" data-r="sample"><div style="flex:1"><b>Send me a sample nudge</b><i>See how a message looks</i></div><span style="color:var(--ss-faint);font-size:20px">›</span></div></div>' +
      '<div class="sub">Make sure alerts arrive</div><div class="card" style="padding:2px 16px">' +
      '<div class="row" data-r="perm"><div style="flex:1"><b>Notifications</b><i>' + (ok ? "Allowed" : "Turn on to get alerts") + '</i></div><span class="chip ' + (ok ? "on" : "") + '">' + (ok ? "Allowed" : "Allow") + '</span></div>' +
      '<div class="row" data-r="exact"><div style="flex:1"><b>Exact alarms</b><i>' + (H.exact === "denied" ? "Needed so alarms ring on time" : "On time, every time") + '</i></div><span class="chip ' + (H.exact === "denied" ? "" : "on") + '">' + (H.exact === "denied" ? "Allow" : "OK") + '</span></div>' +
      (ACC.native ? '<div class="row" data-r="full"><div style="flex:1"><b>Alarm over lock screen</b><i>' + (ACC.fullScreen ? "On — alarms open full screen" : "Allow so alarms open full screen") + '</i></div><span class="chip ' + (ACC.fullScreen ? "on" : "") + '">' + (ACC.fullScreen ? "OK" : "Allow") + '</span></div>' : "") +
      '<div class="row" data-r="batt"><div style="flex:1"><b>Battery</b><i>' + (ACC.batteryUnrestricted ? "Unrestricted — alarms are never delayed" : "Set to “Unrestricted” so alarms are never delayed") + '</i></div><span class="chip ' + (ACC.batteryUnrestricted ? "on" : "") + '">' + (ACC.batteryUnrestricted ? "OK" : "Allow") + '</span></div>' +
      '<div class="row" data-r="test"><div style="flex:1"><b>Test alarm in 10 seconds</b><i>Close the app after tapping to check it rings</i></div><span class="chip on">Test</span></div></div>';
    el.onclick = async function (e) {
      var t = e.target.closest("[data-r],#ld button[data-v]"); if (!t) return; var r = t.dataset.r;
      if (t.dataset.v != null) { LS.set("ss_shift_lead", t.dataset.v); if (st) await AL.syncShifts(st.shifts, +t.dataset.v, LS.get("ss_shift_sound", "chime"), true); return drawRem(); }
      if (r === "nudge") { LS.set("ss_nudges", nud ? "0" : "1"); await AL.scheduleNudges(); toast(nud ? "Nudges off" : "Nudges on 💌"); return drawRem(); }
      if (r === "rem") { var on = !rem; LS.set("ss_shift_rem", on ? "1" : "0"); if (on) await Core.perm.need("notifications"); if (st) await AL.syncShifts(st.shifts, lead, LS.get("ss_shift_sound", "chime"), on); toast(on ? "Shift alarm on" : "Shift alarm off"); return drawRem(); }
      if (r === "snd") return pickSound(LS.get("ss_shift_sound", "chime"), async function (s) { LS.set("ss_shift_sound", s); if (st) await AL.syncShifts(st.shifts, lead, s, true); drawRem(); });
      if (r === "sample") { var M = AL.messages.start, m = M[Math.floor(Math.random() * M.length)]; await Core.perm.need("notifications"); await AL.notifyNow(m[0], m[1].replace("{seat}", ""), { path: "/clock.html", tab: "shift" }); return toast("Sent — check your notifications"); }
      if (r === "perm") { await Core.perm.need("notifications"); HEALTH = await AL.health(); AL.schedule(); AL.scheduleNudges(); return drawRem(); }
      if (r === "exact") { try { await N.LocalNotifications.changeExactNotificationSetting(); } catch (e2) {} return; }
      if (r === "full") { AL.openFullScreen(); return; }
      if (r === "batt") { if (ACC.native) AL.openBattery(); else { try { N.Settings.open({ optionAndroid: N.AndroidSettings.BatteryOptimization, optionIOS: N.IOSSettings.App }); } catch (e3) {} } return; }
      if (r === "test") { if (!(await Core.perm.need("notifications"))) return; await AL.testIn(10); toast("Test alarm in 10 seconds"); }
    };
  }


  VIEWS.focus = vFocus; VIEWS.shift = vShift;

  /* ---------- start ---------- */
  function resumed() { AL.pull().then(function (ch) { if (ch && (cur === "timer" || cur === "alarm")) VIEWS[cur](); }); }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) resumed(); });
  window.addEventListener("ss:resume", resumed);
  Core.getUser().then(async function (u) {
    if (u && u.role !== "student") { $("#v").innerHTML = '<div class="empty" style="padding-top:90px"><div class="em">⏰</div><b>Not available</b><br>The clock is part of the student app.</div>'; return; }
    student = !!(u && u.role === "student");
    var ids = tabs(); if (ids.indexOf(cur) < 0) cur = "alarm";
    try { await AL.ready; await AL.pull(); } catch (e) {}
    try { AL.rollRandom(); } catch (e) {}
    tab(cur);
    window.addEventListener("resize", function () { var on = $("#tabs button.on"), ind = $("#tabs .ind"); if (on && ind) { ind.style.width = (on.offsetWidth - 20) + "px"; ind.style.transform = "translateX(" + (on.offsetLeft + 10) + "px)"; } });
  });
})();
</script></body></html>
