<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><title>Create account — Study Space</title>
<link rel="stylesheet" href="/assets/tailwind.css"/>
<script>if(window.top!==window){try{window.top.location.replace(location.pathname)}catch(e){}}</script></head>
<body class="min-h-screen text-white" style="background:radial-gradient(900px 500px at 15% -10%,#6366f1 0,transparent 60%),radial-gradient(800px 500px at 100% 100%,#db2777 0,transparent 55%),linear-gradient(160deg,#1e1b4b,#312e81 55%,#4c1d95)">
<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-6 pb-10 pt-20">
  <h1 class="text-3xl font-extrabold leading-tight">Create your<br/>account</h1>
  <p class="mt-2 text-sm text-indigo-100">Choose how you want to use Study Space.</p>
  <div class="mt-8 space-y-4">
    <a href="/register.html" class="opt"><span class="oi" style="background:linear-gradient(135deg,#38bdf8,#6366f1)">🎓</span><span class="flex-1"><b>I’m a student</b><i>Join a study center, see notices, seat &amp; attendance</i></span><span class="text-2xl text-white/70">›</span></a>
    <a href="/create-center.html" class="opt"><span class="oi" style="background:linear-gradient(135deg,#f472b6,#f59e0b)">🏢</span><span class="flex-1"><b>I run a study center</b><i>Create your center and manage seats, shifts &amp; students</i></span><span class="text-2xl text-white/70">›</span></a>
  </div>
  <a href="/login.html" class="mt-8 text-center text-sm font-semibold text-indigo-100 underline">Already have an account? Login</a>
</main>
<style>
.opt{display:flex;align-items:center;gap:16px;padding:18px;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(20px);box-shadow:0 20px 40px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.opt:active{transform:scale(.98)}.opt b{display:block;font-size:16px}.opt i{display:block;font-style:normal;font-size:12.5px;color:#e0e7ff;margin-top:3px}
.oi{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:26px}
</style>
<script src="/config.js"></script><script src="/native.js"></script><script src="/core.js"></script>
</body></html>
