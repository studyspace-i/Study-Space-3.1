name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build:web
      - run: npx cap add android
      - name: Permissions, icon and signing key
        run: bash scripts/android-setup.sh
      - run: npx cap sync android
      - name: Trust the server's missing intermediate certificate
        run: bash scripts/trust-chain.sh study.mrharshit.in
      - name: Build production APK
        run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with: { name: StudySpace-apk, path: StudySpace.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Study Space APK #${{ github.run_number }}
          files: StudySpace.apk
